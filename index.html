<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صدقة جارية عن أنس ثروت عبد الحليم الشباك</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Readex+Pro:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f0;--card:#fbfcfb;--ink:#26363a;--soft:#5d7176;--accent:#4d7c78;--line:#d3dedb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121b1d;--card:#1a2629;--ink:#e6eeec;--soft:#9bb0ad;--accent:#7fb3ad;--line:#2b3b3e}}
:root[data-theme="dark"]{--bg:#121b1d;--card:#1a2629;--ink:#e6eeec;--soft:#9bb0ad;--accent:#7fb3ad;--line:#2b3b3e}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Readex Pro',Tahoma,Arial,sans-serif;font-weight:300;min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:520px;padding:28px 20px 40px;text-align:center}
.photo{width:220px;height:220px;margin:0 auto 18px;border-radius:50%;overflow:hidden;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block;transition:opacity .5s}
.photo img.f{opacity:0}
h1{font-family:Amiri,'Times New Roman',serif;font-size:1.9rem;line-height:1.5;margin:0 0 6px;font-weight:700}
.dates{color:var(--soft);font-size:.95rem;line-height:1.9;margin:0 0 26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:30px 22px;min-height:190px;display:flex;flex-direction:column;justify-content:center;gap:12px}
.kind{color:var(--accent);font-size:.9rem;margin:0}
.txt{font-family:Amiri,'Times New Roman',serif;font-size:1.65rem;line-height:2.1;margin:0;transition:opacity .4s}
.txt.f{opacity:0}
.src{color:var(--soft);font-size:.82rem;margin:0}
button{margin-top:20px;font:inherit;font-size:1rem;color:#fff;background:var(--accent);border:0;border-radius:999px;padding:12px 30px;cursor:pointer}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button{color:#0f1a1c}}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.foot{margin-top:30px;color:var(--soft);font-size:.9rem;line-height:2}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
<div class="photo"><img id="img" alt="أنس ثروت عبد الحليم الشباك"></div>
<h1>أنس ثروت عبد الحليم الشباك</h1>
<p class="dates">تاريخ الوفاة: ١٦ / ١٠ / ٢٠٢٦ م<br>٥ جمادى الأولى ١٤٤٨ هـ</p>
<section class="card" aria-live="polite">
<p class="kind" id="kind"></p>
<p class="txt" id="txt"></p>
<p class="src" id="src"></p>
</section>
<button id="btn" type="button">دعاء أو ذكر آخر</button>
<p class="foot">صدقة جارية عن روحه<br>اللهم ارحمه واغفر له وأسكنه فسيح جناتك</p>

["دعاء","اللهم نقّه من الخطايا كما ينقّى الثوب الأبيض من الدنس","رواه مسلم"],
["دعاء","اللهم أنزله منزلًا مباركًا وأنت خير المنزلين",""],

["دعاء","اللهم ثبّته عند السؤال","رواه أبو داود"],

["دعاء","اللهم أسكنه الفردوس الأعلى من الجنة",""],
["دعاء","اللهم آنسه في وحدته، وارحم غربته، وتجاوز عن سيئاته، وضاعف حسناته",""],
["دعاء","اللهم لا تحرمنا أجره ولا تفتنّا بعده، واغفر لنا وله","رواه أبو داود وابن ماجه"],

["آية","يَا أَيَّتُهَا النَّفْسُ الْمُطْمَئِنَّةُ ارْجِعِي إِلَىٰ رَبِّكِ رَاضِيَةً مَّرْضِيَّةً فَادْخُلِي فِي عِبَادِي وَادْخُلِي جَنَّتِي","سورة الفجر"],
["آية","كُلُّ نَفْسٍ ذَائِقَةُ الْمَوْتِ ۗ وَإِنَّمَا تُوَفَّوْنَ أُجُورَكُمْ يَوْمَ الْقِيَامَةِ","سورة آل عمران"],
["آية","الَّذِينَ إِذَا أَصَابَتْهُم مُّصِيبَةٌ قَالُوا إِنَّا لِلَّهِ وَإِنَّا إِلَيْهِ رَاجِعُونَ","سورة البقرة"],
["آية","وَبَشِّرِ الصَّابِرِينَ","سورة البقرة"],
["ذكر","سبحان الله وبحمده، سبحان الله العظيم","متفق عليه"],
["ذكر","لا حول ولا قوة إلا بالله، كنز من كنوز الجنة","متفق عليه"],
["ذكر","أستغفر الله العظيم وأتوب إليه",""],
["ذكر","اللهم صلِّ وسلّم على نبينا محمد","من صلى عليه صلاة صلى الله عليه بها عشرًا"],
["ذكر","لا إله إلا الله وحده لا شريك له، له الملك وله الحمد وهو على كل شيء قدير",""],
["ذكر","سبحان الله، والحمد لله، ولا إله إلا الله، والله أكبر",""],
["ذكر","اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ","من آية الكرسي، سورة البقرة"],
["ذكر","حسبنا الله ونعم الوكيل",""],
["ذكر","إنا لله وإنا إليه راجعون، اللهم أجرنا في مصيبتنا واخلف لنا خيرًا منها","رواه مسلم"]

var $=function(i){return document.getElementById(i)};
function rnd(n,last){var k;do{k=Math.floor(Math.random()*n)}while(n>1&&k===last);return k}
var li=-1,lp=-1;
try{li=+sessionStorage.getItem('li');lp=+sessionStorage.getItem('lp');if(isNaN(li))li=-1;if(isNaN(lp))lp=-1}catch(e){}
function show(first){
 var i=rnd(D.length,li),p=rnd(IMGS.length,lp);li=i;lp=p;
 try{sessionStorage.setItem('li',i);sessionStorage.setItem('lp',p)}catch(e){}
 var apply=function(){$('kind').textContent=D[i][0];$('txt').textContent=D[i][1];$('src').textContent=D[i][2];$('img').src=IMGS[p];$('txt').classList.remove('f');$('img').classList.remove('f')};
 if(first){apply();return}
 $('txt').classList.add('f');$('img').classList.add('f');setTimeout(apply,350);
}
$('btn').addEventListener('click',function(){show(false)});
show(true);
</script>
